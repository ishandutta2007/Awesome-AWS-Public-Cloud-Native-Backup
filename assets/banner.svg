<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="aws-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#F90"/><stop offset="100%" stop-color="#FFB84D"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}}@keyframes streamData{0%{stroke-dashoffset:400}}@keyframes pulsePill{0%{opacity:.9;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes subtleRotate{0%{transform:rotate(-5deg)}}.glow-orb-1{animation:floatOrb1 12s ease-in-out infinite alternate}.glow-orb-2{animation:floatOrb2 15s ease-in-out infinite alternate}.pulse-pill{animation:pulsePill 4s ease-in-out infinite}.data-stream{stroke-dasharray:8 12;animation:streamData 20s linear infinite}.shield-spin{animation:subtleRotate 10s ease-in-out infinite alternate;transform-origin:1040p