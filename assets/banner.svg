<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 15s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8 12;
        animation: streamData 20s linear infinite;
      }
      .shield-spin {
        animation: subtleRotate 10s ease-in-out infinite alternate;
        transform-origin: 1040px 190px;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-60px, -30px) scale(1.2); }
      }
      @keyframes streamData {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulsePill {
        0%, 100% { opacity: 0.9; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-3px); }
      }
      @keyframes subtleRotate {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(5deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Ambient Orbs -->
  <g class="glow-orb-1">
    <circle cx="200" cy="120" r="160" fill="url(#cyan-glow)" filter="blur(60px)"/>
  </g>
  <g class="glow-orb-2">
    <circle cx="1020" cy="240" r="180" fill="url(#purple-glow)" filter="blur(70px)"/>
  </g>
  <circle cx="600" cy="380" r="140" fill="#0284c7" fill-opacity="0.1" filter="blur(50px)"/>

  <!-- Background Animated Data Stream Waves (Behind Content) -->
  <g fill="none" opacity="0.35">
    <path class="data-stream" d="M -50 320 Q 300 240, 600 310 T 1250 250" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-stream" d="M -50 360 Q 350 290, 650 350 T 1250 300" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 14s;"/>
    <path class="data-stream" d="M -50 280 Q 250 340, 550 270 T 1250 330" stroke="#c084fc" stroke-width="1.5" style="animation-duration: 25s;"/>
  </g>

  <!-- Ambient Node Cluster (Right Side Background Art) -->
  <g class="shield-spin" opacity="0.4">
    <!-- Outer Shield Hexagon Orbit -->
    <polygon points="1040,110 1110,150 1110,230 1040,270 970,230 970,150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Center Vault Hub -->
    <circle cx="1040" cy="190" r="45" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="1040" cy="190" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Mini Satellite Nodes -->
    <circle cx="1110" cy="150" r="6" fill="#38bdf8"/>
    <circle cx="1110" cy="230" r="6" fill="#818cf8"/>
    <circle cx="970" cy="150" r="6" fill="#c084fc"/>
    <circle cx="970" cy="230" r="6" fill="#38bdf8"/>
    <circle cx="1040" cy="110" r="7" fill="#FF9900"/>
    <circle cx="1040" cy="270" r="6" fill="#10b981"/>
  </g>

  <!-- Foreground Content Block -->
  <!-- Top Category Pill -->
  <g class="pulse-pill" transform="translate(80, 55)">
    <rect width="320" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
      ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM
    </text>
  </g>

  <!-- Main Headline Title (Clear, Dominant Foreground) -->
  <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome AWS &amp; Cloud-Native
  </text>
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
    Backup &amp; Disaster Recovery
  </text>

  <!-- Subtitle (Clear, readable, high contrast) -->
  <text x="80" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
    Curated SaaS Platforms, Immutable Vaults, Kubernetes DR &amp; Policy-as-Code Automation
  </text>

  <!-- Interactive / Informative Capability Badges (Foreground) -->
  <g transform="translate(80, 290)">
    <!-- Pill 1: AWS Native -->
    <g transform="translate(0, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#FF9900"/>
      <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AWS Native</text>
    </g>

    <!-- Pill 2: Immutable Vaults -->
    <g transform="translate(147, 0)">
      <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Immutable Vaults</text>
    </g>

    <!-- Pill 3: Kubernetes DR -->
    <g transform="translate(324, 0)">
      <rect width="150" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#818cf8"/>
      <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Kubernetes DR</text>
    </g>

    <!-- Pill 4: Policy-as-Code -->
    <g transform="translate(486, 0)">
      <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#c084fc"/>
      <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Policy-as-Code</text>
    </g>

    <!-- Pill 5: Zero-RPO / Ransomware-Proof -->
    <g transform="translate(658, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Ransomware Defense</text>
    </g>
  </g>

  <!-- Sleek Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#text-grad)"/>
</svg>
